<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<title>SaaSBets Architecture</title>

<style>

:root {

  --bg: #0f172a;
  --panel: #111827;
  --card: #1e293b;

  --text: #f8fafc;
  --muted: #94a3b8;

  --blue: #3b82f6;
  --green: #22c55e;
  --yellow: #facc15;
  --purple: #a855f7;
  --red: #ef4444;

  --border: #334155;
}

* {
  box-sizing: border-box;
}

body {

  font-family: Arial;
  background: var(--bg);
  color: var(--text);

  margin: 0;
  padding: 40px;
}

h1 {

  text-align: center;
  margin-bottom: 32px;

  font-size: 42px;
}

.topbar {

  display: flex;
  justify-content: center;

  margin-bottom: 32px;
}

.search {

  width: 420px;

  background: var(--panel);

  border: 1px solid var(--border);

  color: white;

  padding: 14px 18px;

  border-radius: 14px;

  font-size: 16px;
}

.grid {

  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 24px;
}

.card {

  background: var(--card);

  border-radius: 20px;

  padding: 24px;

  border: 1px solid var(--border);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.25);
}

.section-title {

  font-size: 26px;
  margin-bottom: 24px;

  font-weight: bold;
}

.group {

  margin-bottom: 28px;
}

.group h3 {

  margin-bottom: 12px;
  color: var(--muted);
}

.item {

  padding: 10px 14px;

  border-radius: 12px;

  margin-bottom: 10px;

  transition: 0.2s;
}

.item:hover {

  transform: translateX(4px);
}

.frontend .item {

  background: rgba(59,130,246,0.18);
}

.backend .item {

  background: rgba(34,197,94,0.18);
}

.external .item {

  background: rgba(250,204,21,0.18);
}

.jobs .item {

  background: rgba(168,85,247,0.18);
}

.flow {

  display: flex;

  gap: 14px;

  flex-wrap: wrap;

  margin-top: 14px;
}

.step {

  background: rgba(59,130,246,0.2);

  padding: 12px 18px;

  border-radius: 14px;

  font-weight: bold;
}

.arrow {

  display: flex;
  align-items: center;

  color: var(--muted);

  font-size: 20px;
}

.highlight {

  outline: 2px solid white;
  transform: scale(1.03);
}

</style>

</head>

<body>

<h1>SaaSBets Architecture</h1>

<div class="topbar">

  <input
    id="search"
    class="search"
    placeholder="Search files, hooks, services..."
  />

</div>

<div id="app"></div>

<script>

fetch("./data/architecture.json")
.then(r => r.json())
.then(data => {

  const app =
    document.getElementById("app");

  app.innerHTML = `

  <div class="grid">

    <div class="card frontend">

      <div class="section-title">
        Frontend
      </div>

      <div class="group">
        <h3>Hooks</h3>

        ${data.frontend.hooks.map(
          h => `<div class="item">${h}</div>`
        ).join("")}
      </div>

      <div class="group">
        <h3>Components</h3>

        ${data.frontend.components.map(
          c => `<div class="item">${c}</div>`
        ).join("")}
      </div>

    </div>

    <div class="card backend">

      <div class="section-title">
        Backend
      </div>

      <div class="group">
        <h3>Routes</h3>

        ${data.backend.routes.map(
          r => `<div class="item">${r}</div>`
        ).join("")}
      </div>

      <div class="group">
        <h3>Services</h3>

        ${data.backend.services.map(
          s => `<div class="item">${s}</div>`
        ).join("")}
      </div>

    </div>

    <div class="card external">

      <div class="section-title">
        External Services
      </div>

      ${data.external.oauth.map(
        o => `<div class="item">${o}</div>`
      ).join("")}

      ${data.external.apis.map(
        a => `<div class="item">${a}</div>`
      ).join("")}

    </div>

    <div class="card jobs">

      <div class="section-title">
        Jobs & Automation
      </div>

      ${data.jobs.map(
        j => `<div class="item">${j}</div>`
      ).join("")}

    </div>

  </div>

  <div class="card" style="margin-top:24px;">

    <div class="section-title">
      Application Flows
    </div>

    ${data.flows.map(flow => `

      <h3>${flow.title}</h3>

      <div class="flow">

        ${flow.steps.map((s, i) => `

          <div class="step">${s}</div>

          ${i < flow.steps.length - 1
            ? '<div class="arrow">→</div>'
            : ''
          }

        `).join("")}

      </div>

    `).join("")}

  </div>

  `;

const search =
  document.getElementById("search");

search.addEventListener(
  "input",
  (e) => {

    const value =
      e.target.value.toLowerCase();

    document
      .querySelectorAll(".item")
      .forEach((item) => {

        const text =
          item.textContent.toLowerCase();

        if (
          value &&
          text.includes(value)
        ) {
          item.classList.add(
            "highlight"
          );
        } else {
          item.classList.remove(
            "highlight"
          );
        }
      });
  }
);

});

</script>

</body>
</html>
