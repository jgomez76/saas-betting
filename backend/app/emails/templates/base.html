<!DOCTYPE html>
<html lang="{{ language }}">

<head>

    <meta charset="UTF-8">

    <style>

        body{
            margin:0;
            padding:40px;
            background:#f5f7fb;
            font-family:Arial, Helvetica, sans-serif;
            color:#222;
        }

        .container{
            max-width:600px;
            margin:auto;
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .header{
            background:#0f172a;
            color:white;
            padding:30px;
            text-align:center;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
        }

        .content{
            padding:40px;
            line-height:1.7;
        }

        .button{
            display:inline-block;
            padding:14px 26px;
            background:#2563eb;
            color:white !important;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
            margin-top:25px;
        }

        .footer{
            background:#f1f5f9;
            padding:25px;
            text-align:center;
            font-size:13px;
            color:#64748b;
        }

        .footer a{
            color:#2563eb;
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            💎 Luranix
        </div>

    </div>

    <div class="content">

        {% block content %}
        {% endblock %}

    </div>

    <div class="footer">

        <p>

            {{ t.footer_help }}

            <br><br>

            <a href="mailto:admin@luranix.com">
                admin@luranix.com
            </a>

        </p>

        <p>

            © {{ year }} Luranix

        </p>

    </div>

</div>

</body>

</html>
